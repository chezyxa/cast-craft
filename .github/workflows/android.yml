name: Android build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/openssl
          key: openssl-3.0.15-ndk-${{ env.NDK_VERSION }}-api24-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build OpenSSL
        run: scripts/build-openssl.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CastCraft-apk
          path: app/build/outputs/apk/release/*.apk
