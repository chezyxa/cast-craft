name: Android build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/openssl
          key: openssl-3.0.15-ndk-${{ env.NDK_VERSION }}-api24-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build OpenSSL
        run: scripts/build-openssl.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: CastCraft-apk
          path: app/build/outputs/apk/release/*.apk

      # Public direct download for the TV (e.g. the Downloader app):
      # https://github.com/<owner>/<repo>/releases/download/latest/CastCraft.apk
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CastCraft.apk
          git tag -f latest
          git push -f origin latest
          gh release view latest > /dev/null 2>&1 || \
            gh release create latest --title "Cast Craft (latest build)" \
              --notes "Latest APK built from ${GITHUB_REF_NAME}. Install on Google TV / Android TV."
          gh release upload latest CastCraft.apk --clobber

      # Short link for the TV: https://<owner>.github.io/<repo>/ (and .../tv.apk)
      - name: Prepare GitHub Pages site
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          cp CastCraft.apk site/tv.apk
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Cast Craft</title>
          <meta http-equiv="refresh" content="0; url=tv.apk">
          <p><a href="tv.apk">Cast Craft APK</a></p>
          HTML
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push'
