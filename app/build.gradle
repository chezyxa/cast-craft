plugins {
    id 'com.android.application'
}

def appAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']

android {
    namespace 'com.castcraft.airplay'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.castcraft.airplay'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters(*appAbis)
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                cFlags '-fvisibility=hidden'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly on a TV.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

// Builds the static OpenSSL libcrypto the native code links against (once per ABI).
def opensslDir = file('src/main/cpp/third_party/openssl')
tasks.register('buildOpenssl', Exec) {
    onlyIf { appAbis.any { !new File(opensslDir, "${it}/lib/libcrypto.a").exists() } }
    workingDir rootDir
    commandLine 'bash', "${rootDir}/scripts/build-openssl.sh"
    environment 'ABIS', appAbis.join(' ')
    doFirst {
        environment 'ANDROID_NDK_ROOT', android.ndkDirectory.absolutePath
    }
}
tasks.named('preBuild') { dependsOn 'buildOpenssl' }
